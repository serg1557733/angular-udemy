<app-header/>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user (select)="onSelect($event)" [user] = "user" />
      </li>
    }
  </ul>
  @if (selectedUser) {
    <app-tasks [userName]="selectedUser.name" [userId]="selectedUser.id"/>
  } @else {
    <p id="fallback">Select a user to see task</p>
  }
</main>
